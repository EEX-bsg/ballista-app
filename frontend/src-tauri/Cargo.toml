[package]
name = "ballista-app"
version = "0.1.0"
description = "Besiege Mod Manager"
authors = ["EEX-slime"]
license = "MPL-2.0"
repository = "https://github.com/besiegelauncher/ballista-launcher"
edition = "2021"

# バイナリとライブラリの両方として使用
[lib]
name = "ballista_app"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "ballista-app"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "dialog-all", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.31", features = ["serialize"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
walkdir = "2.4"
# ログ関連のクレート
log = "0.4"
env_logger = "0.10"
# 設定ファイル関連
config = "0.13"
notify = "6.1"
once_cell = "1.19"
dirs-next = "2.0.0"
tokio = { version = "1", features = ["full"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"] 
